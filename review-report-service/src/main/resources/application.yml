server:
  port: 8083
  servlet:
    context-path: /api/reviews

spring:
  application:
    name: review-report-service

  datasource:
    url: jdbc:postgresql://localhost:5432/travel_review_db
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  cache:
    type: simple

service:
  poi:
    url: http://poi-service:8081/api/poi

app:
  media:
    upload-dir: ${REVIEW_MEDIA_UPLOAD_DIR:uploads/review-media}
    public-url-prefix: ${REVIEW_MEDIA_PUBLIC_URL_PREFIX:/api/reviews/media}
    max-file-size-bytes: ${REVIEW_MEDIA_MAX_FILE_SIZE_BYTES:5242880}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.travelapp.review.controller
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.travelapp.review: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/review-service.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

services:
  auth:
    url: http://auth-service:8084/api
    me-path: /internal/users/me
    info-path: /internal/users/{id}/info
    exists-path: /internal/users/{id}/exists
